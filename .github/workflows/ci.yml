name: StudiBro CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework django-cors-headers google-generativeai python-dotenv flake8
      - name: Run Linter (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run Django Tests
        run: python manage.py test

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/studibro_mobile
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9' 
      - name: Install Dependencies
        run: flutter pub get
      - name: Run Linter (Analyze)
        run: flutter analyze
      - name: Run Flutter Tests
        run: flutter test


      - name: Verify Documentation Generation
        run: |
          pip install pdoc
          pdoc . --output-dir docs-preview