name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ] # Runs only when code is merged into main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # --- STEP 1: Generate Backend Docs ---
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install pdoc
        run: pip install pdoc python-dotenv django djangorestframework
      - name: Generate Django Docs
        run: |
          # Creates docs in a temporary folder
          pdoc ./backend/api -o ./temp_docs/backend

      # --- STEP 2: Generate Frontend Docs ---
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Generate Flutter Docs
        run: |
          cd frontend/studibro_mobile
          flutter pub get
          dart doc .
          # Move generated docs to the temporary folder
          mkdir -p ../../temp_docs/frontend
          cp -r doc/api/* ../../temp_docs/frontend

      # --- STEP 3: Create Landing Page ---
      - name: Create Index Page
        run: |
          cat <<EOF > ./temp_docs/index.html
          <!DOCTYPE html>
          <html>
          <head><title>StudiBro Documentation</title></head>
          <body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
            <h1>StudiBro Project Documentation</h1>
            <p>Select a module to view documentation:</p>
            <div style="margin-top: 20px;">
              <a href="./backend/index.html" style="padding: 10px 20px; background: #2ecc71; color: white; text-decoration: none; border-radius: 5px; margin: 10px;">Backend (Django)</a>
              <a href="./frontend/index.html" style="padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 5px; margin: 10px;">Frontend (Flutter)</a>
            </div>
          </body>
          </html>
          EOF

      # --- STEP 4: Deploy to GitHub Pages ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./temp_docs